name: Feature request
description: Propose a focused improvement to Stellar Trace.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Stellar developer workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or protocol references
      description: Link official Stellar documentation, examples, or user feedback where possible.
    validations:
      required: false
